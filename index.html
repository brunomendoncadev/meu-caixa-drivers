<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Caixa v.7</title>
<!-- Versão local: sem login, dados só neste navegador. Para ícone na tela inicial, veja manifest/PWA. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3f5;--card:#fff;--ink:#14181f;--mut:#667080;--line:#e1e4e8;--ac:#f5c518;--acink:#14181f;--pos:#16845a;--neg:#cf3f2a;--bar:#d5d9df}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1f27;--ink:#f1f3f6;--mut:#97a0ac;--line:#29303a;--pos:#3ecf8e;--neg:#ff7a66;--bar:#2d3540}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1f27;--ink:#f1f3f6;--mut:#97a0ac;--line:#29303a;--pos:#3ecf8e;--neg:#ff7a66;--bar:#2d3540}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font:700 30px/1 'Barlow Condensed',Barlow,sans-serif;margin:4px 0 14px}
h2{font:700 20px/1 'Barlow Condensed',Barlow,sans-serif;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
input{width:100%;font:inherit;font-size:18px;padding:11px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.full{grid-column:1/-1}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acink);font:700 18px Barlow,sans-serif}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:700 15px Barlow,sans-serif}
.tabs button.on{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.big{display:flex;gap:8px;margin-bottom:12px}
.big div{flex:1;background:var(--bg);border-radius:10px;padding:9px}
.big b{display:block;font:700 22px 'Barlow Condensed',Barlow,sans-serif}
.big small{color:var(--mut);font-size:12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{margin:9px 0}.row .t{display:flex;justify-content:space-between;font-size:14px}
.bar{height:9px;background:var(--bar);border-radius:5px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:5px}
.bar i.best{background:var(--pos)}
.hrs{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:8px}
.hrs div{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.hrs div.best{background:var(--pos)}
.lab{display:flex;gap:2px;font-size:10px;color:var(--mut)}.lab span{flex:1;text-align:center}
.mut{color:var(--mut);font-size:14px}
.ent{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ent button{border:1px solid var(--line);background:none;color:var(--mut);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
#msg{min-height:20px;font-size:15px;font-weight:700;margin-top:8px}input[type=checkbox]{width:auto;margin-right:10px;transform:scale(1.4)}.chk{display:flex;align-items:center;font-size:16px;color:var(--ink);margin-bottom:12px}
.wk{display:flex;align-items:center;justify-content:space-between;margin-top:12px}.nav{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;width:46px;height:40px;font-size:22px}
#omsg,#fmsg{min-height:20px;font-size:15px;font-weight:700;margin-top:8px}.err{color:var(--neg)}.ok{color:var(--pos)}input.bad{border-color:var(--neg);outline:2px solid var(--neg)}
</style></head><body>
<h1>Meu Caixa <small style="font:500 14px Barlow,sans-serif;color:var(--mut)">v.7</small></h1>

<section><h2>Anotar o dia</h2>
<div class="g">
<div class="full"><label for="d">Dia</label><input id="d" type="date"></div>
<div><label for="s">Começou às</label><input id="s" type="time"></div>
<div><label for="f">Terminou às</label><input id="f" type="time"></div>
<div class="full"><label for="km">Quilômetros rodados no dia</label><input id="km" inputmode="decimal" placeholder="0"></div>
<div><label for="md">Média do painel (km/l)</label><input id="md" inputmode="decimal" placeholder="0,0"></div>
<div><label for="p">Preço do litro (R$)</label><input id="p" inputmode="decimal" placeholder="0,00"></div>
<div class="full mut" id="est"></div>
<div><label for="u">Ganhos Uber (R$)</label><input id="u" inputmode="decimal" placeholder="0,00"></div>
<div><label for="n">Ganhos 99 (R$)</label><input id="n" inputmode="decimal" placeholder="0,00"></div>
<div class="full" id="ptw" hidden><label for="pt">Ganhos particular (R$)</label><input id="pt" inputmode="decimal" placeholder="0,00"></div>
</div>
<button class="btn" id="add">Salvar dia</button><div id="msg" role="status"></div></section>

<section><h2>Abastecimento</h2>
<div class="g">
<div class="full"><label for="fd">Dia</label><input id="fd" type="date"></div>
<div><label for="fv">Valor pago (R$)</label><input id="fv" inputmode="decimal" placeholder="0,00"></div>
<div><label for="fp">Preço por litro (R$)</label><input id="fp" inputmode="decimal" placeholder="0,00"></div>
<div class="full mut" id="fest"></div>
</div>
<button class="btn" id="addf">Salvar abastecimento</button><div id="fmsg" role="status"></div></section>

<section id="osec" hidden><h2>Semana do carro alugado</h2>
<div class="g">
<div class="full"><label for="wini">Km inicial da semana</label><input id="wini" inputmode="numeric" placeholder="0"></div>
<div class="full"><label for="wfim">Km final da semana</label><input id="wfim" inputmode="numeric" placeholder="0"></div>
<div><label for="wrent">Aluguel da semana (R$)</label><input id="wrent" inputmode="decimal" placeholder="0,00"></div>
<div><label for="wlim">Limite de km da semana</label><input id="wlim" inputmode="numeric" placeholder="0"></div>
</div>
<div class="wk"><button class="nav" id="wprev" aria-label="Semana anterior">‹</button><span class="mut" id="wlabel"></span><button class="nav" id="wnext" aria-label="Próxima semana">›</button></div>
<button class="btn" id="addw">Salvar semana</button><div id="omsg" role="status"></div></section>

<section><h2>Meu caixa</h2>
<div class="tabs" id="vtabs"><button data-v="g" class="on">Ganhos</button><button data-v="c">Gastos</button><button data-v="k">Km</button></div>
<div class="tabs" id="tabs"><button data-m="day" class="on">Dia</button><button data-m="week">Semana</button><button data-m="month">Mês</button></div>
<div class="big" id="big"></div><div id="list"></div></section>

<section><h2>Melhores dias da semana</h2><div id="wd"></div></section>
<section><h2>Melhores horários</h2><div id="hr"></div></section>
<section><h2>Últimos dias trabalhados</h2><div id="ents"></div></section>
<section><h2>Últimos abastecimentos</h2><div id="fents"></div></section>

<section><h2>Configurações e backup</h2>
<label class="chk"><input type="checkbox" id="usepart"> Usar o campo “Ganhos particular”</label>
<label class="chk"><input type="checkbox" id="rentcb"> Uso carro alugado</label>
<p class="mut">Seus dados ficam só neste navegador. Exporte de vez em quando.</p>
<button class="btn" id="exp">Exportar backup</button>
<label class="btn" style="display:block;text-align:center;font-size:18px;color:var(--acink)">Importar backup<input id="imp" type="file" accept=".json" hidden></label></section>

<script>
const $=s=>document.querySelector(s);
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{v=String(v).trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)||0};
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const dur=e=>{let d=mins(e.end)-mins(e.start);if(d<=0)d+=1440;return d};
const gain=e=>e.uber+e.n99+(e.part||0);  // dias antigos não têm 'part' -> conta como 0
const ni=v=>parseInt(String(v).split(',')[0].replace(/\D/g,''))||0;  // só dígitos (1.250 ou 1250)
const hm=m=>Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'');  // 510 min -> 8h30
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const LS='meucaixa_v1';
let E=[],F=[],O=[],W={},AW=null,mode='day',view='g',delId=null,CFG={price:0,media:0};  // E = lista de dias; CFG = preço e média

// localStorage guarda texto por chave; por isso usamos JSON.stringify (objeto->texto) e JSON.parse (texto->objeto)
function locSave(){try{localStorage.setItem(LS,JSON.stringify(E));localStorage.setItem(LS+'c',JSON.stringify(CFG));localStorage.setItem(LS+'f',JSON.stringify(F));localStorage.setItem(LS+'w',JSON.stringify(W))}catch(e){}}
function locLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
// Salvar = gravar a lista (E) e as configurações (CFG) no localStorage
function save(){locSave()}
// Ao abrir a página: lê os dados salvos no navegador e desenha a tela
function initStore(){
  E=locLoad();
  try{CFG=JSON.parse(localStorage.getItem(LS+'c')||'{}')}catch(e){}
  try{F=JSON.parse(localStorage.getItem(LS+'f')||'[]')}catch(e){}
  if(!Array.isArray(F))F=[];
  try{W=JSON.parse(localStorage.getItem(LS+'w')||'{}')}catch(e){}
  try{O=JSON.parse(localStorage.getItem(LS+'o')||'[]')}catch(e){}
  migrateOdo();
  fillCfg();render();
}

function key(e){return mode==='day'?e.date:mode==='week'?iso(mon(pd(e.date))):e.date.slice(0,7)}
function label(k){
  if(mode==='month'){const[a,b]=k.split('-');return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][b-1]+'/'+a}
  const d=pd(k),s=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
  return mode==='day'?DIAS[d.getDay()].slice(0,3)+' '+s:'Semana de '+s;
}
function sum(list){return list.reduce((a,e)=>{a.g+=gain(e);a.c+=e.fuel;a.km+=e.km;a.m+=dur(e);return a},{g:0,c:0,km:0,m:0})}

// Cada SEMANA (segunda a domingo) guarda os próprios valores: W['2026-10-05'] = {ini, fim, rent, lim}
// Assim um reajuste do aluguel ou do limite nunca altera semanas passadas.
const wm=k=>{const t=pd(k);t.setDate(t.getDate()+1);return iso(t).slice(0,7)};  // mês da terça-feira da semana
const addDays=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return iso(d)};
const wd=k=>String(pd(k).getDate()).padStart(2,'0')+'/'+String(pd(k).getMonth()+1).padStart(2,'0');
const curWeek=()=>iso(mon(new Date()));
function rentOf(k){   // aluguel só entra na semana e no mês (nunca no dia)
  if(!CFG.rentOn||mode==='day')return 0;
  if(mode==='week')return (W[k]&&W[k].rent)||0;
  return Object.keys(W).filter(m=>wm(m)===k).reduce((a,m)=>a+(W[m].rent||0),0);
}
function kmTotal(k){  // km rodados pelo carro (só semanas já fechadas)
  const f=m=>W[m]&&W[m].ini&&W[m].fim?W[m].fim-W[m].ini:null;
  if(mode==='week')return f(k);
  if(mode==='day')return null;
  const l=Object.keys(W).filter(m=>wm(m)===k&&f(m)!=null);
  return l.length?l.reduce((a,m)=>a+f(m),0):null;
}
const limOf=k=>(mode==='week'&&W[k]&&W[k].lim)||0;
// v.6 guardava o km solto e o aluguel/limite nas configurações. Converte para semanas.
function migrateOdo(){
  if(!(O.length||CFG.rent||CFG.kmlim)){O=[];return}
  const by={};O.forEach(o=>{const k=iso(mon(pd(o.date)));(by[k]=by[k]||[]).push(o.km)});
  if(!Object.keys(by).length)by[curWeek()]=[];
  Object.keys(by).forEach(k=>{const r=by[k],w=W[k]=W[k]||{};
    if(r.length&&!w.ini)w.ini=Math.min(...r);
    if(r.length>1&&!w.fim)w.fim=Math.max(...r);
    if(CFG.rent&&!w.rent)w.rent=CFG.rent;
    if(CFG.kmlim&&!w.lim)w.lim=CFG.kmlim});
  O=[];delete CFG.rent;delete CFG.kmlim;
  try{localStorage.removeItem(LS+'o')}catch(e){}
  locSave();
}
function pickWeek(){  // semana aberta (só km inicial) > semana seguinte à última fechada > semana atual
  const ks=Object.keys(W).sort(),open=ks.filter(k=>W[k].ini&&!W[k].fim).pop();
  if(open)return open;
  const done=ks.filter(k=>W[k].fim).pop(),cur=curWeek();
  if(!done)return cur;
  const nx=addDays(done,7);return nx>cur?nx:cur;
}
const lastOf=(k,f)=>{const p=Object.keys(W).sort().filter(x=>x<k&&W[x][f]).pop();return p?W[p][f]:0};
function loadWeek(){
  if(!AW)AW=pickWeek();
  const w=W[AW]||{},v=x=>x?String(x).replace('.',','):'';
  $('#wini').value=v(w.ini);$('#wfim').value=v(w.fim);$('#wrent').value=v(w.rent);$('#wlim').value=v(w.lim);
  const ph=(i,x)=>{$(i).placeholder=x?v(x):'0'};   // dica: valor da semana anterior
  ph('#wini',lastOf(AW,'fim'));ph('#wrent',lastOf(AW,'rent'));ph('#wlim',lastOf(AW,'lim'));
  $('#wlabel').textContent='Semana de '+wd(AW)+' a '+wd(addDays(AW,6))+(AW===curWeek()?' · atual':'');
}

function renderGanhos(){
  const gr={};E.forEach(e=>(gr[key(e)]=gr[key(e)]||[]).push(e));
  const now=key({date:iso(new Date())});
  const cur=sum(gr[now]||[]);
  const lucro=cur.g-cur.c-rentOf(now);
  $('#big').innerHTML=`<div><b>${brl(cur.g)}</b><small>Ganhos</small></div><div><b class="neg">${brl(cur.c)}</b><small>Combustível (estimado)</small></div><div><b class="${lucro>=0?'pos':'neg'}">${brl(lucro)}</b><small>Sobrou</small></div>`;
  const keys=Object.keys(gr).sort().reverse().slice(0,mode==='day'?7:mode==='week'?8:6);
  const tops=keys.map(k=>sum(gr[k]).g),mx=Math.max(1,...tops);
  $('#list').innerHTML=keys.length?keys.map((k,i)=>{const s=sum(gr[k]),sb=s.g-s.c-rentOf(k);return `<div class="row"><div class="t"><span>${label(k)} <span class="mut">· ${hm(s.m)}</span></span><span>${brl(s.g)} · sobrou <b class="${sb>=0?'pos':'neg'}">${brl(sb)}</b></span></div><div class="bar"><i style="width:${tops[i]/mx*100}%"></i></div></div>`}).join(''):'<p class="mut">Anote seu primeiro dia para ver os totais aqui.</p>';
  if(rentOf(now))$('#list').innerHTML='<p class="mut">Já descontado: aluguel de '+brl(rentOf(now))+'.</p>'+$('#list').innerHTML;
}

// Aba Gastos: abastecido (real) x estimado pelo trabalho (km / média x preço)
function renderGastos(){
  const gr={},z=()=>({g:0,est:0,real:0});
  E.forEach(e=>{const x=gr[key(e)]=gr[key(e)]||z();x.est+=e.fuel;x.g+=gain(e)});
  F.forEach(f=>{const x=gr[key(f)]=gr[key(f)]||z();x.real+=f.valor});
  const c=gr[key({date:iso(new Date())})]||z();
  $('#big').innerHTML=`<div><b>${brl(c.real)}</b><small>Abastecido</small></div><div><b>${brl(c.est)}</b><small>Estimado (trabalho)</small></div><div><b class="${c.real-c.est>0?'neg':'pos'}">${brl(c.real-c.est)}</b><small>Fora do app</small></div>`;
  const keys=Object.keys(gr).sort().reverse().slice(0,mode==='day'?7:mode==='week'?8:6);
  const mx=Math.max(1,...keys.map(k=>Math.max(gr[k].real,gr[k].est)));
  const nota=mode==='day'?'Por dia pode não bater: você nem sempre abastece no mesmo dia em que trabalha.':'';
  $('#list').innerHTML=(keys.length?keys.map(k=>{const x=gr[k];return `<div class="row"><div class="t"><span>${label(k)}</span><span>Abastecido <b>${brl(x.real)}</b>${rentOf(k)?' · Aluguel <b>'+brl(rentOf(k))+'</b>':''}</span></div><div class="bar"><i style="width:${x.real/mx*100}%"></i></div></div>`}).join(''):'<p class="mut">Lance um abastecimento para ver os gastos aqui.</p>')+(nota?`<p class="mut">${nota}</p>`:'');
}

function renderKm(){
  const gr={},n=v=>Math.round(v).toLocaleString('pt-BR')+' km';
  E.forEach(e=>{const x=gr[key(e)]=gr[key(e)]||{w:0};x.w+=e.km});
  const rent=CFG.rentOn&&mode!=='day';
  if(rent)Object.keys(W).forEach(m=>{const k=mode==='week'?m:wm(m);gr[k]=gr[k]||{w:0}});
  const tot=k=>rent?kmTotal(k):null;
  const nk=key({date:iso(new Date())}),c=gr[nk]||{w:0},t=tot(nk),lm=limOf(nk);
  $('#big').innerHTML=`<div><b>${n(c.w)}</b><small>Trabalho</small></div>`+(rent?`<div><b>${t==null?'–':n(t)}</b><small>Total do carro</small></div><div><b>${t==null?'–':n(t-c.w)}</b><small>Particular</small></div>`:'');
  const keys=Object.keys(gr).sort().reverse().slice(0,mode==='day'?7:mode==='week'?8:6);
  const mx=Math.max(1,...keys.map(k=>Math.max(gr[k].w,tot(k)||0)));
  let lim='';
  if(rent&&mode==='week'&&lm&&t!=null)lim=t<=lm?`<p class="mut">Limite da semana: restam <b>${n(lm-t)}</b> de ${n(lm)}.</p>`:`<p class="neg" style="font-size:14px">Limite da semana: passou <b>${n(t-lm)}</b> de ${n(lm)}.</p>`;
  $('#list').innerHTML=lim+(keys.length?keys.map(k=>{const x=gr[k],tk=tot(k);return `<div class="row"><div class="t"><span>${label(k)}</span><span>Trabalho <b>${n(x.w)}</b></span></div><div class="bar"><i style="width:${x.w/mx*100}%"></i></div>${tk!=null?`<div class="mut">Carro ${n(tk)} · particular ${n(tk-x.w)}</div>`:''}</div>`}).join(''):'<p class="mut">Anote um dia com km para ver aqui.</p>');
}

function render(){
  view==='c'?renderGastos():view==='k'?renderKm():renderGanhos();

  // melhores dias
  const W=Array.from({length:7},()=>({g:0,m:0}));
  const H=Array.from({length:24},()=>({s:0,w:0}));
  E.forEach(e=>{
    const w=W[pd(e.date).getDay()],d=dur(e),r=gain(e)/(d/60);
    w.g+=gain(e);w.m+=d;
    const st=mins(e.start);
    for(let t=0;t<d;){const a=(st+t)%1440,h=Math.floor(a/60),step=Math.min(60-a%60,d-t);H[h].s+=r*step;H[h].w+=step;t+=step}
  });
  const wr=W.map(w=>w.m?w.g/(w.m/60):0),wm=Math.max(...wr);
  $('#wd').innerHTML=wm?[1,2,3,4,5,6,0].map(i=>`<div class="row"><div class="t"><span>${DIAS[i]}</span><span>${wr[i]?brl(wr[i])+'/hora':'sem dados'}</span></div><div class="bar"><i class="${wr[i]===wm?'best':''}" style="width:${wr[i]/wm*100}%"></i></div></div>`).join('')+`<p class="mut">Melhor dia: <b>${DIAS[wr.indexOf(wm)]}</b>, média de ${brl(wm)} por hora.</p>`:'<p class="mut">Os gráficos aparecem depois do primeiro registro.</p>';
  const hr=H.map(h=>h.w?h.s/h.w:0),hm=Math.max(...hr);
  $('#hr').innerHTML=hm?`<div class="hrs">${hr.map(v=>`<div class="${v===hm?'best':''}" style="height:${v/hm*100}%" title="${brl(v)}/hora"></div>`).join('')}</div><div class="lab">${hr.map((_,i)=>`<span>${i%3===0?i+'h':''}</span>`).join('')}</div><p class="mut">Melhor horário: <b>${hr.indexOf(hm)}h</b>, média de ${brl(hm)} por hora.</p>`:'<p class="mut">Os gráficos aparecem depois do primeiro registro.</p>';

  $('#fents').innerHTML=F.length?[...F].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(f=>`<div class="ent"><span>${pd(f.date).toLocaleDateString('pt-BR')} · ${brl(f.valor)}${f.litros?' · '+(+f.litros).toLocaleString('pt-BR',{maximumFractionDigits:1})+' L':''}</span><button data-fid="${f.id}">${delId===f.id?'Confirmar?':'Excluir'}</button></div>`).join(''):'<p class="mut">Nenhum abastecimento ainda.</p>';
  $('#ents').innerHTML=E.length?[...E].sort((a,b)=>b.date.localeCompare(a.date)||b.start.localeCompare(a.start)).slice(0,10).map(e=>`<div class="ent"><span>${pd(e.date).toLocaleDateString('pt-BR')} · ${e.start}–${e.end}<br><span class="mut">${e.km} km · Uber ${brl(e.uber)} · 99 ${brl(e.n99)}${e.part?' · Part. '+brl(e.part):''} · comb. est. ${brl(e.fuel)}</span></span><button data-id="${e.id}">${delId===e.id?'Confirmar?':'Excluir'}</button></div>`).join(''):'<p class="mut">Nenhum registro ainda.</p>';
}

$('#vtabs').onclick=ev=>{const v=ev.target.dataset.v;if(!v)return;view=v;document.querySelectorAll('#vtabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()};
$('#fents').onclick=ev=>{const id=ev.target.dataset.fid;if(!id)return;if(delId===id){F=F.filter(f=>f.id!==id);delId=null;save()}else delId=id;render()};
function festim(){const v=num($('#fv').value),p=num($('#fp').value);$('#fest').textContent=v&&p?'Litros estimados: '+(v/p).toLocaleString('pt-BR',{maximumFractionDigits:1})+' L':''}
['fv','fp'].forEach(i=>$('#'+i).addEventListener('input',festim));
$('#addf').onclick=()=>{
  const d=$('#fd').value,v=num($('#fv').value),p=num($('#fp').value),m=$('#fmsg');
  if(!d||!v||!p){m.className='err';m.textContent='Informe o dia, o valor pago e o preço por litro.';return}
  F.push({id:Date.now().toString(36),date:d,valor:v,preco:p,litros:v/p});
  CFG.price=p;fillCfg();est();   // o preço do último abastecimento vira o preço usado na estimativa do dia
  $('#fv').value='';festim();save();render();
  m.className='ok';m.textContent='✔ Abastecimento salvo!';setTimeout(()=>m.textContent='',4000);
};
$('#tabs').onclick=ev=>{const m=ev.target.dataset.m;if(!m)return;mode=m;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));render()};
$('#ents').onclick=ev=>{const id=ev.target.dataset.id;if(!id)return;if(delId===id){E=E.filter(e=>e.id!==id);delId=null;save()}else delId=id;render()};
function warn(t,ids){const m=$('#msg');m.className='err';m.textContent=t;['d','s','f','km','md','p'].forEach(i=>$('#'+i).classList.remove('bad'));(ids||[]).forEach(i=>$('#'+i).classList.add('bad'));m.scrollIntoView({block:'center',behavior:'smooth'})}
$('#add').onclick=()=>{
  try{
    const d=$('#d').value,s=$('#s').value,f=$('#f').value;
    const nm={d:'o dia',s:'a hora que começou',f:'a hora que terminou'};
    const miss=[['d',d],['s',s],['f',f]].filter(x=>!x[1]).map(x=>x[0]);
    if(miss.length){warn('Falta preencher: '+miss.map(i=>nm[i]).join(' e ')+'.',miss);return}
    const km=num($('#km').value),md=num($('#md').value),pr=num($('#p').value);
    if(km&&(!md||!pr)){warn('Para estimar o combustível, informe a média do painel (km/l) e o preço do litro.',[!md&&'md',!pr&&'p'].filter(Boolean));return}
    E.push({id:Date.now().toString(36),date:d,start:s,end:f,km,uber:num($('#u').value),n99:num($('#n').value),part:CFG.part?num($('#pt').value):0,fuel:md?km/md*pr:0,media:md,preco:pr});
    CFG.price=pr;CFG.media=md;  // (não recriar o CFG, senão perde a opção 'part')
    ['km','u','n','pt'].forEach(i=>$('#'+i).value='');est();
    ['d','s','f','km','md','p'].forEach(i=>$('#'+i).classList.remove('bad'));
    save();render();
    const m=$('#msg');m.className='ok';m.textContent='✔ Dia salvo!';
    $('#big').scrollIntoView({block:'center',behavior:'smooth'});
    setTimeout(()=>m.textContent='',4000);
  }catch(e){warn('Erro ao salvar: '+e.message)}
};
function applyPart(){
  $('#ptw').hidden=!CFG.part;$('#usepart').checked=!!CFG.part;
  $('#rentcb').checked=!!CFG.rentOn;$('#osec').hidden=!CFG.rentOn;
  loadWeek();
}
function fillCfg(){if(CFG.price)$('#p').value=$('#fp').value=String(CFG.price).replace('.',',');if(CFG.media)$('#md').value=String(CFG.media).replace('.',',');applyPart()}
function est(){const k=num($('#km').value),m=num($('#md').value),q=num($('#p').value);$('#est').textContent=k&&m&&q?'Combustível estimado do dia: '+brl(k/m*q):''}
['km','md','p'].forEach(i=>$('#'+i).addEventListener('input',est));
$('#p').addEventListener('change',()=>{CFG.price=num($('#p').value);$('#fp').value=$('#p').value;save()});
$('#d').value=iso(new Date());$('#fd').value=iso(new Date());
$('#rentcb').onchange=()=>{CFG.rentOn=$('#rentcb').checked;save();applyPart();render()};
$('#wprev').onclick=()=>{AW=addDays(AW,-7);loadWeek()};
$('#wnext').onclick=()=>{AW=addDays(AW,7);loadWeek()};
$('#addw').onclick=()=>{
  const m=$('#omsg'),ini=ni($('#wini').value),fim=ni($('#wfim').value),rent=num($('#wrent').value),lim=ni($('#wlim').value);
  const bad=t=>{m.className='err';m.textContent=t};
  if(fim&&!ini)return bad('Informe também o km inicial da semana.');
  if(fim&&fim<=ini)return bad('O km final precisa ser maior que o km inicial.');
  const w={};if(ini)w.ini=ini;if(fim)w.fim=fim;if(rent)w.rent=rent;if(lim)w.lim=lim;
  const empty=!Object.keys(w).length;
  if(empty)delete W[AW];else W[AW]=w;
  const closed=!!fim;
  if(closed)AW=addDays(AW,7);   // fechou a semana: passa para a próxima, com os campos limpos
  save();loadWeek();render();
  m.className='ok';m.textContent=empty?'Semana limpa.':closed?'✔ Semana fechada! Agora: semana de '+wd(AW)+'.':'✔ Semana salva!';
  setTimeout(()=>m.textContent='',5000);
};
$('#usepart').onchange=()=>{CFG.part=$('#usepart').checked;save();applyPart()};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({versao:7,list:E,cfg:CFG,fuels:F,weeks:W})],{type:'application/json'}));a.download='meu-caixa-backup-'+iso(new Date())+'.json';a.click()};
$('#imp').onchange=async ev=>{try{const d=JSON.parse(await ev.target.files[0].text());if(!Array.isArray(d.list))throw 0;E=d.list;CFG=d.cfg||CFG;F=Array.isArray(d.fuels)?d.fuels:F;O=Array.isArray(d.odo)?d.odo:O;if(d.weeks&&typeof d.weeks==='object')W=d.weeks;AW=null;migrateOdo();save();fillCfg();render()}catch(e){alert('Arquivo de backup inválido.')}};
initStore();
</script></body></html>
